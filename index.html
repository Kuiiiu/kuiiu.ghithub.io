<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kuii Fun Facts</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #009990;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }
  h1 {
    margin-bottom: 30px;
  }
  #fact {
    max-width: 500px;
    margin: 0 auto 30px auto;
    font-size: 1.2em;
    background: #006660;
    padding: 20px;
    border-radius: 10px;
    min-height: 80px;
  }
button {
  font-size: 1em;
  padding: 12px 24px;
  background: #000000;      /* Black background */
  border: none;
  border-radius: 6px;
  cursor: pointer;
  color: #a020f0;           /* Purple text */
  font-weight: bold;
  transition: background 0.2s ease, transform 0.15s ease;
}

button:hover {
  background: #1a1a1a;      /* Slightly lighter black on hover */
  transform: translateY(-2px);
}
  }
</style>
</head>
<body>

<h1>kuii Fun Facts</h1>
<div id="fact">Click the button to learn something about kuii</div>
<button onclick="showFact()">Give me a fact</button>

<script>
  const facts = [
    "i can 3d model.",
    "i like teal.",
    "i am 16.",
    "kuii comes from kuiil from the mandolorion.",
    "i play the ukulele and guitar.'"
  ];

  function showFact() {
    const random = facts[Math.floor(Math.random() * facts.length)];
    document.getElementById("fact").textContent = random;
  }
</script>

</body>
</html>

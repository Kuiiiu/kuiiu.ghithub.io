<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shark Fun Facts</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0b3d59;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }
  h1 {
    margin-bottom: 30px;
  }
  #fact {
    max-width: 500px;
    margin: 0 auto 30px auto;
    font-size: 1.2em;
    background: #114b6e;
    padding: 20px;
    border-radius: 10px;
    min-height: 80px;
  }
  button {
    font-size: 1em;
    padding: 12px 24px;
    background: #ff9800;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #0b3d59;
    font-weight: bold;
  }
  button:hover {
    background: #ffb74d;
  }
</style>
</head>
<body>

<h1> rice facts </h1>
<div id="fact">Click the button to learn something about sharks!</div>
<button onclick="showFact()">Give me a fact</button>

<script>
  const facts = [
    "Rice is a primary food source for over half the world's population",
    "There are over 40,000 varieties of rice",
    "China is the largest producer of rice",
    "Rice has been cultivated for over 5,000 years",
    "The word rice"" is derived from the Old French word ris"
    "In Japan, rice is considered sacred'"
  ];

  function showFact() {
    const random = facts[Math.floor(Math.random() * facts.length)];
    document.getElementById("fact").textContent = random;
  }
</script>

</body>
</html>

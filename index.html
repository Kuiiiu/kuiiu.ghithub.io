<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shark Fun Facts</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0b3d59;
    color: white;
    text-align: center;
    padding: 60px 20px;
  }
  h1 {
    margin-bottom: 30px;
  }
  #fact {
    max-width: 500px;
    margin: 0 auto 30px auto;
    font-size: 1.2em;
    background: #114b6e;
    padding: 20px;
    border-radius: 10px;
    min-height: 80px;
  }
  button {
    font-size: 1em;
    padding: 12px 24px;
    background: #ff9800;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #0b3d59;
    font-weight: bold;
  }
  button:hover {
    background: #ffb74d;
  }
</style>
</head>
<body>

<h1> rice facts </h1>
<div id="fact">Click the button to learn something about sharks!</div>
<button onclick="showFact()">Give me a fact</button>

<script>
  const facts = [
    "Sharks have been around longer than trees — over 400 million years.",
    "Some sharks can go into a trance-like state called 'tonic immobility' when flipped upside down.",
    "A shark's skeleton is made entirely of cartilage, not bone.",
    "Great white sharks can detect a single drop of blood in 25 gallons of water.",
    "Whale sharks are the largest fish in the ocean but eat mostly plankton.",
    "Sharks constantly grow new teeth throughout their lives, some going through thousands.",
    "Hammerhead sharks have a nearly 360-degree view of their surroundings.",
    "Some sharks, like the bullhead shark, can walk along the ocean floor using their fins.",
    "Cookiecutter sharks take round bites out of larger animals, including whales.",
    "Sharks don't have a swim bladder — they rely on their liver, full of oil, to help stay buoyant.",
    "The dwarf lantern shark is the smallest shark species, about the size of a human hand.",
    "Some sharks can live over 400 years — the Greenland shark is the longest-living vertebrate known.",
    "Sharks have electroreceptors called the Ampullae of Lorenzini that detect electrical signals from prey.",
    "Not all sharks need to swim constantly — some can pump water over their gills while resting.",
    "A group of sharks is called a 'shiver.'"
  ];

  function showFact() {
    const random = facts[Math.floor(Math.random() * facts.length)];
    document.getElementById("fact").textContent = random;
  }
</script>

</body>
</html>
